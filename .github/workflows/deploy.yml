name: Build & Deploy

# Runs when application code or helm chart values change on main.
#
# ─── OFF BY DEFAULT ───────────────────────────────────────────────────────────
# Every step that touches AWS is gated on the repository variable
# AWS_DEPLOY_ENABLED. Until it is set to the string "true", this workflow builds
# nothing, pushes nothing, and never assumes the IAM role — the AWS jobs report
# as skipped, which is a green run, not a red one.
#
# A variable rather than deleting the steps: the pipeline stays fully written and
# reviewable now, and switching it on later is one setting, not a code change.
#
#   Settings → Secrets and variables → Actions → Variables
#     AWS_DEPLOY_ENABLED = true
#   …and the AWS_ROLE_ARN secret must exist, or every AWS job fails at OIDC.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "helm-chart/**"
      # exclude: this is the file THIS workflow writes — including it would loop
      - "!helm-chart/values-images.yaml"
  workflow_dispatch:   # manual run; always rebuilds every service (see below)

permissions:
  id-token: write    # OIDC — authenticate to AWS
  contents: write    # needed to commit + push the updated values-images.yaml

env:
  AWS_REGION: us-east-1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Work out which services actually changed.
  #
  # Emits a matrix of only those services, so editing one microservice rebuilds
  # one image instead of eleven. The unchanged services keep the tag they
  # already have in values-images.yaml, which means their rendered Deployment is
  # byte-identical and Kubernetes performs NO rollout for them.
  #
  # Falls back to building everything whenever the diff base is unusable —
  # a manual dispatch, the first push to a branch (before = all zeros), or a
  # force-push where the old commit is gone. Building too much is wasteful;
  # building too little silently ships a stale image, so the fallback errs safe.
  # ────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any:    ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff against the previous commit

      - name: Detect
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base:      ${{ github.event.before }}
          build-all: ${{ github.event_name != 'push' }}

      # Runs even when the deploy is switched off, so the log still shows what
      # WOULD have been built. That makes a disabled run a useful dry run rather
      # than a blank one.
      - name: Deploy switch
        env:
          ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "── AWS_DEPLOY_ENABLED=true — images will be pushed to ECR and the cluster will be updated."
          else
            echo "::notice::AWS_DEPLOY_ENABLED is not 'true' — skipping every AWS step. Nothing was pushed and the cluster was not touched."
            echo "── To turn deploys on: Settings → Secrets and variables → Actions → Variables → AWS_DEPLOY_ENABLED = true"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Resolve the image tag and ECR registry ONCE.
  # Matrix jobs cannot cleanly export a shared output, so computing it here
  # guarantees every parallel build agrees on the same tag.
  # ────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Resolve tag & registry
    runs-on: ubuntu-latest
    needs: changes
    # First AWS contact in the pipeline. Skipping here cascades: every job below
    # needs this one, so one gate switches the whole deploy off.
    if: needs.changes.outputs.any == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'
    outputs:
      image_tag:    ${{ steps.meta.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short git SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build the changed images — one parallel job per service.
  #
  # Each leg gets its own clean runner, which removes the disk-exhaustion risk of
  # stacking JDK + .NET + Node + Python builder layers on a single ~14 GB VM, and
  # its own scoped buildx cache so a Go build never evicts the Java one.
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, prepare]
    if: needs.changes.outputs.any == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'
    strategy:
      # Don't cancel sibling builds because one service failed — seeing every
      # failure in one run beats fixing them one push at a time.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # buildx is what enables the layer cache below; the stock docker builder
      # cannot import/export GitHub Actions cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.ecr_registry }}/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}
          # GitHub caps the cache at 10 GB per repo and evicts least-recently-used,
          # so per-service scopes degrade gracefully rather than thrashing.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Write the new tags into values-images.yaml and push.
  # That commit is what ArgoCD notices; it is the entire deployment trigger.
  #
  # Only the services that were actually rebuilt get their tag rewritten, so the
  # commit diff is exactly as small as the change that caused it.
  #
  # `needs` is AND-gated on success, so one failed matrix leg stops the rollout —
  # the cluster is never pointed at a tag that is missing for some service.
  # ────────────────────────────────────────────────────────────────────────────
  update-values:
    name: Update Image Tags → Trigger ArgoCD
    runs-on: ubuntu-latest
    needs: [changes, prepare, build-and-push]
    if: needs.changes.outputs.any == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A GITHUB_TOKEN push deliberately does NOT trigger further workflow
          # runs, which is what we want: this job commits back to the branch it
          # was triggered from, so anything else would loop. The [skip ci] marker
          # and the values-images.yaml path exclusion are belt-and-braces.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write new tags into values-images.yaml
        env:
          NEW_TAG:      ${{ needs.prepare.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.prepare.outputs.ecr_registry }}
          MATRIX:       ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail

          # yq (mikefarah v4) is preinstalled on ubuntu-latest. Used instead of
          # sed because these are nested keys — sed on nested YAML is how you get
          # a corrupted values file at 2am.
          yq -i ".images.repository = \"${ECR_REGISTRY}\"" helm-chart/values-images.yaml

          for KEY in $(printf '%s' "$MATRIX" | jq -r '.[].valuesKey'); do
            echo "── ${KEY}.image.tag = ${NEW_TAG}"
            yq -i ".${KEY}.image.tag = \"${NEW_TAG}\"" helm-chart/values-images.yaml
          done

          echo "── Resulting tags:"
          yq -o=props '.. | select(has("tag"))' helm-chart/values-images.yaml 2>/dev/null \
            | sed 's/^/     /' \
            || grep -B1 "tag:" helm-chart/values-images.yaml | sed 's/^/     /'

      - name: Commit and push
        env:
          NEW_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm-chart/values-images.yaml

          # Nothing to do if the tags are unchanged (e.g. a re-run of the same
          # SHA). Without this guard `git commit` exits 1 and fails the job.
          if git diff --cached --quiet; then
            echo "── values-images.yaml already at $NEW_TAG — nothing to commit."
            exit 0
          fi

          # [skip ci] prevents this commit from triggering another workflow run
          git commit -m "ci: deploy image tag $NEW_TAG [skip ci]"
          git push

          echo "── Pushed. ArgoCD will detect the change and sync the cluster automatically."
