name: Build & Deploy

# Runs when application code or helm chart values change on main
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "helm-chart/**"
      - "!helm-chart/values.yaml"   # exclude: avoid loop when CI updates this file

permissions:
  id-token: write    # OIDC — authenticate to AWS
  contents: write    # needed to commit + push the updated values.yaml

env:
  AWS_REGION: us-east-1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build all 11 Docker images and push to ECR
  # Output: image tag (short git SHA) + ECR registry URL
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag:    ${{ steps.meta.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short git SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push all services
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG:      ${{ steps.meta.outputs.tag }}
        run: |
          set -e

          build_and_push() {
            local service=$1
            local dockerfile=$2
            local context=$3
            echo "── Building $service → $REGISTRY/$service:$TAG"
            docker build --file "$dockerfile" --tag "$REGISTRY/$service:$TAG" "$context"
            docker push "$REGISTRY/$service:$TAG"
          }

          # Standard services
          for service in \
            adservice checkoutservice currencyservice emailservice \
            frontend loadgenerator paymentservice productcatalogservice \
            recommendationservice shippingservice; do
            build_and_push "$service" "src/$service/Dockerfile" "src/$service"
          done

          # cartservice — Dockerfile is one level deeper
          build_and_push "cartservice" \
            "src/cartservice/src/Dockerfile" \
            "src/cartservice/src"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Update values.yaml with new image tag and push to git
  # ArgoCD watches this file — the push triggers an automatic deployment
  # ────────────────────────────────────────────────────────────────────────────
  update-values:
    name: Update Image Tag → Trigger ArgoCD
    runs-on: ubuntu-latest
    needs: build-and-push    # wait for all images to be pushed first

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a token so the push triggers other workflows (GITHUB_TOKEN push does not)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update images.tag in values.yaml
        env:
          NEW_TAG:      ${{ needs.build-and-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
        run: |
          # Replace the tag line in values.yaml
          # Before: tag: "a1b2c3d4"
          # After:  tag: "e5f6g7h8"
          sed -i "s|^  tag:.*|  tag: \"$NEW_TAG\"|" helm-chart/values.yaml

          # Also update the repository to point at ECR (idempotent — same value each time)
          sed -i "s|^  repository:.*|  repository: $ECR_REGISTRY|" helm-chart/values.yaml

          echo "── values.yaml updated:"
          grep -A2 "^images:" helm-chart/values.yaml

      - name: Commit and push
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm-chart/values.yaml

          # [skip ci] prevents this commit from triggering another workflow run
          git commit -m "ci: deploy image tag $NEW_TAG [skip ci]"
          git push

          echo "── Pushed. ArgoCD will detect the change and sync the cluster automatically."
          echo "── Watch progress at your ArgoCD UI."
