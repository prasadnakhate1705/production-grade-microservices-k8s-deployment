frontend:
  create: true
  name: frontend
  image:
    tag: ""   # managed by CI in values-images.yaml
  # false on purpose: external traffic enters through the Istio ingress-gateway NLB
  # (see frontend-gateway.yaml). Setting this true would spin up a SECOND AWS NLB
  # pointing straight at the frontend, bypassing the mesh — redundant + extra cost.
  externalService: false
  cymbalBranding: false
  # Controls the platform badge shown in the UI header.
  # One of: local, aws, azure, onprem, alibaba. The ArgoCD Application overrides
  # this to "aws" — see argocd/application.yaml.tpl.
  platform: local
  singleSharedSession: false
  # Creates a self-contained Istio Gateway + VirtualService that routes external
  # traffic from the istio-ingressgateway NLB to the frontend Service.
  istioGateway:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

loadGenerator:
  create: true
  name: loadgenerator
  image:
    tag: ""   # managed by CI in values-images.yaml
  # Disabled under Istio. This init container wgets frontend:80 before starting.
  # With the CLASSIC sidecar model, istio-init rewrites iptables to redirect all
  # outbound TCP to Envoy's port 15001, but Envoy is a normal container and so
  # does not start until every init container has finished — the wget is
  # redirected to a port nothing is listening on, burns all 12 retries (120s),
  # exits 1, and the pod restarts init forever (Init:CrashLoopBackOff).
  # Istio >= 1.27 defaults to NATIVE sidecars (an init container with
  # restartPolicy: Always, started first), which would make this work again, but
  # the check is only a convenience — Locust retries the frontend on its own —
  # so leaving it off removes the failure mode regardless of sidecar mode.
  checkFrontendInitContainer: false
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

