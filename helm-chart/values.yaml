    name: redis-cart
    # Uses the public redis image from Docker Hub, otherwise will use the images.repository.
    publicRepository: true
  externalRedisTlsOrigination:
    enable: false
    name: exernal-redis-tls-origination
    endpointAddress: ""
    endpointPort: ""
    certificate: ""

# Not deployed (create: false) — the upstream implementation is cloud-vendor
# specific and its source has been removed from this fork. The name is still
# required: the frontend reads SHOPPING_ASSISTANT_SERVICE_ADDR through a
# must-be-set helper and panics at boot if it is missing, so the env var stays
# wired even though nothing is listening at that address.
shoppingAssistantService:
  create: false
  name: shoppingassistantservice
