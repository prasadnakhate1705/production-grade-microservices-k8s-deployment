# ─────────────────────────────────────────────────────────────────────────────
# IMAGE TAG RESOLUTION — each service resolves its tag in this order:
#
#   <service>.image.tag  →  images.tag  →  Chart.AppVersion
#
# CI writes the PER-SERVICE tags into values-images.yaml, which ArgoCD layers on
# top of this file. That is what makes a one-service change roll only that one
# Deployment: the other ten keep the tag they already had, so their rendered
# manifests are byte-identical and Kubernetes treats them as a no-op.
#
# ─────────────────────────────────────────────────────────────────────────────
images:
  repository: PLACEHOLDER_ECR_REGISTRY  # set by ArgoCD Application parameter (images.repository)
  # Fallback tag for any service with no per-service tag yet (e.g. a brand new
  # service before its first CI build). Empty = fall through to Chart.AppVersion.
  tag: ""

serviceAccounts:
  # Specifies whether service accounts should be created.
  create: true
  # Annotations to add to the service accounts.
  annotations: {}
  # Annotate only the cartservice ServiceAccount. Least privilege: cartservice is
  # the only app that would need a cloud identity (e.g. an IRSA role annotation)
  # to reach an external database.
  annotationsOnlyForCartservice: false

networkPolicies:
  # Specifies if the NetworkPolicies are created or not. If true, one fine granular NetworkPolicy per app is created.
  # Requires the VPC CNI addon with enableNetworkPolicy=true (see modules/eks/main.tf).
  # Without it these objects are created and silently enforce nothing.
  create: true

sidecars:
  # Specifies if the Sidecars are created or not. If true, one fine granular Sidecar per app is created.
  # PERFORMANCE, not security: scopes each Envoy proxy's config to what it needs
  # rather than the whole mesh's address list. Safe to enable — no traffic effect.
  create: true

authorizationPolicies:
  # Specifies if the AuthorizationPolicies are created or not. If true, one fine granular AuthorizationPolicy per app is created.
  # L7 access control on mesh identity (the ServiceAccounts above). Enforced by
  # the Envoy sidecars, so it needs istio-injection on the namespace — which the
  # ArgoCD Application guarantees via managedNamespaceMetadata.
  create: true

peerAuthentication:
  create: true
  # STRICT — sidecars accept mTLS only, rejecting plaintext. This is what makes
  # the authorizationPolicies above airtight: they match on `principals`, which
  # come from the caller's mTLS certificate, and under the PERMISSIVE default a
  # plaintext caller has no principal to check.
  #
  # KNOWN RISK — Kubernetes probes. The kubelet probes from the node, outside the
  # mesh, so its traffic is plaintext:
  #   httpGet   (frontend)      — safe. istiod rewrites these to pilot-agent on
  #                               15020, which calls the app over localhost.
  #   tcpSocket (redis)         — safe. Only asserts the TCP connect succeeds,
  #                               which Envoy does before any TLS handshake.
  #   grpc      (18 probes)     — VERIFY. Native gRPC probes are a real call from
  #                               the kubelet to the app port. Whether istiod
  #                               rewrites these varies by Istio version; if it
  #                               does not, every pod fails its liveness probe
  #                               and CrashLoopBackOffs.
  #
  # Roll out to a test cluster first and watch pod readiness. If the gRPC probes
  # fail, set this to PERMISSIVE — the AuthorizationPolicies keep working, they
  # are just bypassable by an un-meshed pod.
  mode: STRICT

seccompProfile:
  enable: false
  type: RuntimeDefault

securityContext:
  enable: true

